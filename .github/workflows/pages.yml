name: Publicar no GitHub Pages

# Gera o site e publica no branch gh-pages (servido pelo GitHub Pages).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Com domínio próprio (arquivo public/CNAME), o site fica na raiz.
      - name: Build
        run: |
          if [ -f public/CNAME ]; then export VITE_BASE=/; else export VITE_BASE=/${{ github.event.repository.name }}/; fi
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publica no gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
